name: Demo Conditional CI

on:
  pull_request:
    branches:
      - develop

jobs:
  # Job 1: Runs the slow test and determines the outcome
  slow_test_runner:
    runs-on: ubuntu-latest
    # Define an output to communicate the test result to the next job
    outputs:
      test_conclusion: ${{ steps.content_check.outputs.conclusion }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ⌛ Simulate Expensive Build/Test Time (5 minutes)
        run: |
          echo "Starting long-running demo check..."
          sleep 300s
          echo "Demo check complete."

      - name: 🔍 Check Content for Success/Failure
        id: content_check
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q 'README.md'; then
            if grep -q "SKIP CI FAIL" README.md; then
              echo "README.md contains 'SKIP CI FAIL'. Setting conclusion to failure."
              echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            else
              echo "README.md is clean. Setting conclusion to success."
              echo "conclusion=success" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "README.md was not changed. Defaulting to success."
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          fi

  # Job 2: Reports the final status check that Branch Protection will require
  report_status:
    runs-on: ubuntu-latest
    needs: slow_test_runner # Waits for the slow job to finish
    
    # This condition ensures the status is reported correctly even if the prior job failed.
    if: always() 
    
    steps:
      - name: Report Final Status Check
        # Set the status check based on the output of the previous job
        run: |
          CONCLUSION=${{ needs.slow_test_runner.outputs.test_conclusion }}
          
          if [ "$CONCLUSION" == "failure" ]; then
            echo "::error::Conditional Check FAILED - Status set to failure."
            # Exit with a non-zero code to mark the 'report_status' job itself as failed (RED)
            exit 1 
          else
            echo "Conditional Check PASSED - Status set to success."
            # Exit with a zero code to mark the 'report_status' job as successful (GREEN)
          fi