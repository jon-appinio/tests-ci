name: Demo Conditional CI

on:
  pull_request:
    # Trigger only on PR actions where you need to check content
    types: [opened, synchronize]
    branches:
      - develop

jobs:
  # Job 1: Runs the slow test and determines the outcome
  slow_test_runner:
    runs-on: ubuntu-latest
    # Define an output to communicate the test result to the next job
    outputs:
      test_conclusion: ${{ steps.content_check.outputs.conclusion }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        # CRITICAL: Fetch the entire history, including the base branch, for diffing
        with:
          fetch-depth: 0

      - name: ⌛ Simulate Expensive Build/Test Time (1 minute)
        run: |
          echo "Starting long-running demo check..."
          sleep 30s
          echo "Demo check complete."

      - name: 🔍 Check Content for Success/Failure
        id: content_check
        run: |
          # Use git diff to compare the PR's head (current SHA) against the PR's base (target branch's SHA).
          # This captures ALL changes in the PR.

          # Get the list of changed files in the PR
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})

          if echo "$CHANGED_FILES" | grep -q 'README.md'; then
            
            # Check the content of the README.md in the current branch (PR head)
            if grep -q "FORCE CI FAIL" README.md; then
              echo "README.md contains 'FORCE CI FAIL'. Setting conclusion to failure."
              echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            else
              echo "README.md is clean. Setting conclusion to success."
              echo "conclusion=success" >> "$GITHUB_OUTPUT"
            fi
            
          else
            echo "README.md was not changed in this PR. Defaulting to success."
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          fi

  # Job 2: Reports the final status check that Branch Protection will require
  report_status:
    runs-on: ubuntu-latest
    needs: slow_test_runner
    if: always()

    steps:
      - name: Report Final Status Check
        run: |
          CONCLUSION=${{ needs.slow_test_runner.outputs.test_conclusion }}

          if [ "$CONCLUSION" == "failure" ]; then
            echo "::error::Conditional Check FAILED - Status set to failure."
            exit 1 
          else
            echo "Conditional Check PASSED - Status set to success."
          fi
